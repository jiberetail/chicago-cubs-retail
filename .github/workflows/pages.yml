name: Collect Cubs merchandise options
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --max-old-space-size=256 scripts/collect-mlb-options.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubs-merchandise-options
          path: mlb-options.json
